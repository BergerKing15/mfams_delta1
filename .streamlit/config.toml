[runner]
# Nothing in this app uses bare-expression auto-display (every statement is an
# explicit st.xxx() call), so magic's AST rewrite pass has nothing to do here.
# It costs ~50-70ms per script parse for zero benefit on this codebase.
magicEnabled = false

[client]
showErrorDetails = false

[logger]
level = "error"

[telemetry]
enabled = false

[browser]
serverAddress = "localhost"
gatherUsageStats = false

[server]
headless = true
port = 8501
enableXsrfProtection = true
